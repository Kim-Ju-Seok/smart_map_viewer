<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>광주 오프라인 신청 대시보드</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Offline Intelligence</p>
        <h1>광주 오프라인 신청 현황</h1>
        <p class="sub">동 단위 합산 및 클릭 시 상세 위치 확인</p>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">전체</span><strong id="stat-total">-</strong></div>
        <div class="stat"><span class="label">오늘</span><strong id="stat-today">-</strong></div>
      </div>
    </header>

    <section class="filters">
      <div class="filter-block">
        <label>기간 설정</label>
        <div class="range">
          <input type="date" id="date-start" /> <span>~</span> <input type="date" id="date-end" />
        </div>
      </div>
      <div class="filter-block">
        <label>오프라인 경로</label>
        <div class="chips">
          <label class="chip"><input type="checkbox" value="포스터" checked />포스터</label>
          <label class="chip"><input type="checkbox" value="정류장" checked />정류장</label>
          <label class="chip"><input type="checkbox" value="기타" checked />기타</label>
        </div>
      </div>
      <div class="filter-block">
        <label>검색 필터</label>
        <input type="text" id="search-text" placeholder="동 또는 주소 검색" />
      </div>
      <button id="reset-btn" class="reset">초기화</button>
    </section>

    <section class="content-grid">
      <div class="panel map-panel">
        <div class="panel-head">
          <h2>신청 밀집도 지도</h2>
          <span id="map-status" class="status"></span>
        </div>
        <div id="map" class="map"></div>
        <p class="map-tip">* 동 버블을 클릭하면 상세 위치가 표시됩니다. 바탕을 클릭하면 복귀합니다.</p>
      </div>
      <div class="panel table-panel">
        <div class="panel-head">
          <h2>신청 상세 리스트</h2>
          <span id="list-count" class="status"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>날짜</th><th>동</th><th>경로</th><th>수강지역</th></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
  <script src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=15xlpg9i0x&submodules=geocoder"></script>
  <script src="app.js"></script>
</body>
</html>
