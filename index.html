<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>광주 오프라인 신청 대시보드</title>
  
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="header-left">
        <img src="스밈임티1.png" alt="guide" class="char-main" />
        <div class="title-group">
          <p class="eyebrow">Offline Intelligence</p>
          <h1>광주 오프라인 신청 현황</h1>
          <p class="sub">실시간 지점별 통계 및 위치 기반 인사이트</p>
        </div>
      </div>

      <div class="header-right">
        <div class="branch-summary">
          <div class="branch-pill donggu">
            <span class="b-name">동구점</span>
            <strong id="count-donggu">0</strong>
          </div>
          <div class="branch-pill namgu">
            <span class="b-name">남구점</span>
            <strong id="count-namgu">0</strong>
          </div>
          <div class="branch-pill cheomdan">
            <span class="b-name">첨단점</span>
            <strong id="count-cheomdan">0</strong>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label"><i class="fa-solid fa-users"></i> 누적 신청</span>
            <strong id="stat-total">-</strong>
          </div>
          <div class="stat highlight">
            <span class="label"><i class="fa-solid fa-bolt"></i> 오늘 신규</span>
            <strong id="stat-today">-</strong>
          </div>
        </div>
        <img src="스밈임티2.png" alt="analyzing" class="char-sub" />
      </div>
    </header>

    <section class="filters">
      <div class="filter-block date-group">
        <label><i class="fa-regular fa-calendar"></i> 기간 설정</label>
        <div class="range">
          <input type="text" id="date-start" placeholder="시작일" readonly /> 
          <span class="separator">~</span> 
          <input type="text" id="date-end" placeholder="종료일" readonly />
        </div>
      </div>

      <div class="filter-block branch-group">
        <label><i class="fa-solid fa-location-dot"></i> 신청 지점</label>
        <div class="chips">
          <label class="chip"><input type="checkbox" value="동구점" data-type="branch" checked /><span>동구점</span></label>
          <label class="chip"><input type="checkbox" value="남구점" data-type="branch" checked /><span>남구점</span></label>
          <label class="chip"><input type="checkbox" value="첨단점" data-type="branch" checked /><span>첨단점</span></label>
        </div>
      </div>

      <div class="filter-block path-group">
        <label><i class="fa-solid fa-layer-group"></i> 유입 경로</label>
        <div class="chips">
          <label class="chip"><input type="checkbox" value="버스정류장" checked /><span>버스정류장</span></label>
          <label class="chip"><input type="checkbox" value="버스의자시트" checked /><span>버스의자시트</span></label>
          <label class="chip"><input type="checkbox" value="택배 배송차량" checked /><span>택배차량</span></label>
          <label class="chip"><input type="checkbox" value="현수막" checked /><span>현수막</span></label>
          <label class="chip"><input type="checkbox" value="포스터(벽보)" checked /><span>포스터</span></label>
          <label class="chip"><input type="checkbox" value="전단지" checked /><span>전단지</span></label>
          <label class="chip"><input type="checkbox" value="국민취업지원제도" checked /><span>국취제</span></label>
          <label class="chip"><input type="checkbox" value="교내광고" checked /><span>교내광고</span></label>
          <label class="chip"><input type="checkbox" value="설명회" checked /><span>설명회</span></label>
          <label class="chip"><input type="checkbox" value="아파트 거울" checked /><span>아파트거울</span></label>
          <label class="chip"><input type="checkbox" value="지인 추천" checked /><span>지인 추천</span></label>
          <label class="chip"><input type="checkbox" value="기타" checked /><span>기타</span></label>
        </div>
      </div>

      <div class="filter-block search-group">
        <label><i class="fa-solid fa-magnifying-glass"></i> 통합 검색</label>
        <input type="text" id="search-text" placeholder="지점, 동 이름, 주소 검색" />
      </div>

      <div class="filter-footer">
        <button id="reset-btn" class="reset">
          <i class="fa-solid fa-rotate-right"></i> 필터 초기화
        </button>
        <button id="deselect-all-btn" class="deselect">
          <i class="fa-solid fa-square-minus"></i> 전체 선택 해제
        </button>
        <img src="스밈임티3.png" alt="success" class="char-btn" />
      </div>
    </section>

    <section class="content-grid">
      <div class="panel map-panel">
        <div class="panel-head">
          <h2><i class="fa-solid fa-map-location-dot"></i> 지역별 신청 밀집도 및 광고 위치</h2>
          <div id="map-status" class="status-badge"></div>
        </div>
        <div id="map" class="map"></div>
        <div class="map-footer">
          <p class="map-tip">
            <i class="fa-solid fa-circle-info"></i> 
            주황색 버블은 신청자 밀집도를, 파란색 아이콘은 오프라인 광고(버스 정류장 등) 위치를 나타냅니다.
          </p>
        </div>
      </div>

      <div class="panel table-panel">
        <div class="panel-head">
          <h2><i class="fa-solid fa-list-ul"></i> 신청 상세 내역</h2>
          <span id="list-count" class="count-badge">0 건</span>
        </div>
        
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>날짜</th>
                <th>신청지점</th>
                <th>행정동</th>
                <th>유입경로</th>
              </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
  <script src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=15xlpg9i0x&submodules=geocoder"></script>
  <script src="roadMapping.js"></script>
  <script src="app.js"></script>
</body>
</html>
