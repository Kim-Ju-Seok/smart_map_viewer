<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오프라인 신청 지도 대시보드</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Offline Map Intelligence</p>
        <h1>오프라인 신청 지도</h1>
        <p class="sub">포스터/정류장 응답자를 동 단위로 누적 표시하고 일자별 집계를 확인합니다.</p>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="label">전체 누적</span>
          <strong id="stat-total">-</strong>
        </div>
        <div class="stat">
          <span class="label">이번주</span>
          <strong id="stat-week">-</strong>
        </div>
        <div class="stat">
          <span class="label">오늘</span>
          <strong id="stat-today">-</strong>
        </div>
      </div>
    </header>

    <section class="filters">
      <div class="filter-block">
        <label>기간</label>
        <div class="range">
          <input type="date" id="date-start" />
          <span>~</span>
          <input type="date" id="date-end" />
        </div>
      </div>
      <div class="filter-block">
        <label>오프라인 경로</label>
        <div class="chips">
          <label class="chip"><input type="checkbox" value="포스터" checked />포스터</label>
          <label class="chip"><input type="checkbox" value="정류장" checked />정류장</label>
          <label class="chip"><input type="checkbox" value="기타" checked />기타</label>
        </div>
      </div>
      <div class="filter-block">
        <label>검색</label>
        <input type="text" id="search-text" placeholder="동/경로/학교 검색" />
      </div>
      <button id="reset-btn" class="reset">초기화</button>
    </section>

    <section class="content-grid">
      <div class="panel map-panel">
        <div class="panel-head">
          <h2>지도</h2>
          <span id="map-status" class="status">데이터 불러오는 중...</span>
        </div>
        <div id="map" class="map"></div>
      </div>

      <div class="panel table-panel">
        <div class="panel-head">
          <h2>리스트</h2>
          <span id="list-count" class="status">-</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>날짜</th>
                <th>동</th>
                <th>오프라인 경로</th>
                <th>수강지역</th>
                <th>건수</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="panel chart-panel">
      <div class="panel-head">
        <h2>일자별 집계</h2>
        <span id="chart-range" class="status">-</span>
      </div>
      <div id="chart" class="chart"></div>
    </section>

    <footer class="footer">
      <p>데이터 소스: Google Sheets (공개 CSV) · 지도: Naver Maps</p>
    </footer>
  </div>

  <script src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=15xlpg9i0x&submodules=geocoder"></script>
  <script src="app.js"></script>
</body>
</html>
