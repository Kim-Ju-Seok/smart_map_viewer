<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>광주 오프라인 신청 대시보드</title>
  
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Offline Intelligence</p>
        <h1>광주 오프라인 신청 현황</h1>
        <p class="sub">데이터를 한눈에 확인하는 와이드 대시보드</p>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">전체 신청</span><strong id="stat-total">-</strong></div>
        <div class="stat"><span class="label">오늘 신규</span><strong id="stat-today">-</strong></div>
      </div>
    </header>

    <section class="filters">
      <div class="filter-block">
        <label>기간 설정</label>
        <div class="range">
          <input type="text" id="date-start" placeholder="시작일" /> 
          <span>~</span> 
          <input type="text" id="date-end" placeholder="종료일" />
        </div>
      </div>
      <div class="filter-block">
        <label>오프라인 유입 경로</label>
        <div class="chips">
          <label class="chip"><input type="checkbox" value="포스터" checked />포스터</label>
          <label class="chip"><input type="checkbox" value="정류장" checked />정류장</label>
          <label class="chip"><input type="checkbox" value="기타" checked />기타</label>
        </div>
      </div>
      <div class="filter-block">
        <label>검색어 필터</label>
        <input type="text" id="search-text" placeholder="동 이름 또는 상세 주소 검색" />
      </div>
      <button id="reset-btn" class="reset">필터 초기화</button>
    </section>

    <section class="content-grid">
      <div class="panel map-panel">
        <div class="panel-head">
          <h2>신청 밀집도 및 위치 분석</h2>
          <span id="map-status" class="status"></span>
        </div>
        <div id="map" class="map"></div>
        <div class="map-footer">
          <p class="map-tip">* 동 버블 클릭 시 상세 위치 핀이 표시됩니다. 빈 지도를 클릭하면 초기화됩니다.</p>
        </div>
      </div>

      <div class="panel table-panel">
        <div class="panel-head">
          <h2>신청 상세 내역</h2>
          <span id="list-count" class="status">0 건</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>신청 날짜</th>
                <th>행정동</th>
                <th>유입 경로</th>
                <th>수강 신청 지역</th>
              </tr>
            </thead>
            <tbody id="table-body">
              </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
  <script src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=15xlpg9i0x&submodules=geocoder"></script>
  <script src="app.js"></script>
</body>
</html>
